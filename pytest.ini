[pytest]
# Configuración propia del proyecto: sin este archivo pytest tomaba como raíz el pyproject.toml de la carpeta
# Documentos (de otro proyecto) y, al correr desde aquí, también recogía las pruebas de .claude/skills.
testpaths = tests
python_files = test_*.py
filterwarnings =
    # Avisos de FastAPI/Starlette sobre su propia evolución: no dicen nada de este código
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:\s*on_event is deprecated:DeprecationWarning
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:openpyxl.*
